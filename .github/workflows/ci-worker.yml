name: CI Worker

on:
  push:
    paths:
      - 'server/worker/**'
      - 'server/shared/**'
  pull_request:
    paths:
      - 'server/worker/**'
      - 'server/shared/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run unit tests
        run: cd server/worker && go test -v -count=1 ./internal/transcode/... ./internal/packaging/...

      - name: Build worker binary
        run: cd server/worker && go build ./cmd/worker/...
