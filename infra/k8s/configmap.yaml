apiVersion: v1
kind: ConfigMap
metadata:
  name: motionmesh-config
  namespace: motionmesh
data:
  ENVIRONMENT: "${ENVIRONMENT}"
  QUEUE_URL: "nats://nats.motionmesh.svc.cluster.local:4222"
  STORAGE_BUCKET: "${S3_BUCKET_ID}"
  STORAGE_REGION: "${S3_BUCKET_REGION}"
  CLOUDFRONT_DISTRIBUTION_DOMAIN: "${CLOUDFRONT_DISTRIBUTION_DOMAIN}"
  CLOUDFRONT_MEDIA_DOMAIN: "${CLOUDFRONT_MEDIA_DOMAIN}"
  COOKIE_DOMAIN: "${COOKIE_DOMAIN}"
  CLOUDFRONT_PLAYBACK_TTL: "86400"
  ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
  MEDIA_PROXY_MODE: "false"
  # DB Connection Budget:
  # API: 10 replicas * 40 = 400
  # Worker: 20 replicas * 15 = 300
  # Total: 700 (Aurora r6g.large limit is ~1800)
  API_DB_MAX_CONNS: "40"
  API_DB_MIN_CONNS: "5"
  WORKER_DB_MAX_CONNS: "15"
  WORKER_DB_MIN_CONNS: "3"
  WORKER_CONCURRENCY: "8"
  CLEANUP_CONCURRENCY: "8"
  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_MAX_ATTEMPTS: "5"
  OUTBOX_POLL_INTERVAL_MS: "1000"
  BENCHMARK_MODE: "${BENCHMARK_MODE}"
  STRIPE_MODE: "${STRIPE_MODE}"
  AI_MODE: "${AI_MODE}"
