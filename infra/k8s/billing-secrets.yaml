apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: motionmesh-billing-secrets
  namespace: motionmesh
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: motionmesh-billing-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CLERK_SECRET_KEY: "{{ .clerk_secret }}"
        STRIPE_SECRET_KEY: "{{ .stripe_secret }}"
  data:
    - secretKey: clerk_secret
      remoteRef:
        key: motionmesh/${ENVIRONMENT}/clerk
        property: secret_key
    - secretKey: stripe_secret
      remoteRef:
        key: motionmesh/${ENVIRONMENT}/stripe
        property: secret_key
