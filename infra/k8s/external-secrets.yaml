apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: motionmesh
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: motionmesh-secrets
  namespace: motionmesh
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: motionmesh-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .db_username }}:{{ .db_password }}@${AURORA_ENDPOINT}:{{ .db_port }}/motionmesh?sslmode=require"
        REDIS_URL: "redis://{{ .redis_host }}:{{ .redis_port }}"
        CLOUDFRONT_KEY_ID: "{{ .cf_key_id }}"
        CLOUDFRONT_PRIVATE_KEY: "{{ .cf_private_key }}"
  data:
    - secretKey: db_username
      remoteRef:
        key: ${DB_SECRET_ARN}
        property: username
    - secretKey: db_password
      remoteRef:
        key: ${DB_SECRET_ARN}
        property: password
    - secretKey: db_port
      remoteRef:
        key: ${DB_SECRET_ARN}
        property: port
    
    # Cloudfront key
    - secretKey: cf_key_id
      remoteRef:
        key: motionmesh/${ENVIRONMENT}/cloudfront-signing
        property: key_id
    - secretKey: cf_private_key
      remoteRef:
        key: motionmesh/${ENVIRONMENT}/cloudfront-signing
        property: private_key

    
    # Redis (dynamically injected into a secret by deploy script or TF)
    - secretKey: redis_host
      remoteRef:
        key: motionmesh/${ENVIRONMENT}/redis
        property: host
    - secretKey: redis_port
      remoteRef:
        key: motionmesh/${ENVIRONMENT}/redis
        property: port
