apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: motionmesh
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: motionmesh-secrets
  namespace: motionmesh
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: motionmesh-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .db_username }}:{{ .db_password }}@{{ .db_host }}:{{ .db_port }}/{{ .db_name }}?sslmode=require"
        REDIS_URL: "redis://{{ .redis_host }}:{{ .redis_port }}"
        CLERK_SECRET_KEY: "{{ .clerk_secret }}"
        STRIPE_SECRET_KEY: "{{ .stripe_secret }}"
        CLOUDFRONT_KEY_ID: "{{ .cf_key_id }}"
        CLOUDFRONT_PRIVATE_KEY: "{{ .cf_private_key }}"
  data:
    - secretKey: db_username
      remoteRef:
        key: ${DB_SECRET_ARN}
        property: username
    - secretKey: db_password
      remoteRef:
        key: ${DB_SECRET_ARN}
        property: password
    - secretKey: db_host
      remoteRef:
        key: ${DB_SECRET_ARN}
        property: host
    - secretKey: db_port
      remoteRef:
        key: ${DB_SECRET_ARN}
        property: port
    - secretKey: db_name
      remoteRef:
        key: ${DB_SECRET_ARN}
        property: dbname
    
    # Cloudfront key
    - secretKey: cf_key_id
      remoteRef:
        key: motionmesh/${ENVIRONMENT}/cloudfront-signing
        property: key_id
    - secretKey: cf_private_key
      remoteRef:
        key: motionmesh/${ENVIRONMENT}/cloudfront-signing
        property: private_key

    # Manual secrets (must be seeded manually in AWS Secrets Manager)
    - secretKey: clerk_secret
      remoteRef:
        key: motionmesh/${ENVIRONMENT}/clerk
        property: secret_key
    - secretKey: stripe_secret
      remoteRef:
        key: motionmesh/${ENVIRONMENT}/stripe
        property: secret_key
    
    # Redis (dynamically injected into a secret by deploy script or TF)
    - secretKey: redis_host
      remoteRef:
        key: motionmesh/${ENVIRONMENT}/redis
        property: host
    - secretKey: redis_port
      remoteRef:
        key: motionmesh/${ENVIRONMENT}/redis
        property: port
