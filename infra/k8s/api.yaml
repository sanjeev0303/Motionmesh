apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: motionmesh
  labels:
    app: api
spec:
  replicas: 10
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: motionmesh-api
      automountServiceAccountToken: false
      nodeSelector:
        NodeGroup: api
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: api
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: api
        image: ${API_IMAGE_URI}
        ports:
        - containerPort: 8080
        env:
        - name: DB_MAX_CONNS
          valueFrom:
            configMapKeyRef:
              name: motionmesh-config
              key: API_DB_MAX_CONNS
        - name: DB_MIN_CONNS
          valueFrom:
            configMapKeyRef:
              name: motionmesh-config
              key: API_DB_MIN_CONNS
        envFrom:
        - secretRef:
            name: motionmesh-secrets
        - configMapRef:
            name: motionmesh-config
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: motionmesh
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: motionmesh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 10
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
        # Wait, memory isn't always available unless metrics-server is up, but standard for EKS
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: motionmesh
spec:
  minAvailable: 70%
  selector:
    matchLabels:
      app: api
